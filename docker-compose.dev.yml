# ============================================================
# Docker Compose cho môi trường DEV LOCAL
# Khởi động: docker compose -f docker-compose.dev.yml up -d
#
# Cung cấp:
#   - 4 PostgreSQL container (mỗi service 1 instance độc lập)
#   - MongoDB (audit log, chat, in-app noti)
#   - RabbitMQ (event bus)
#   - MinIO (S3-compatible object storage)
#   - Mailhog (giả lập SendGrid để test email dev)
#
# TODO (P1 - Tech Lead, sprint S1):
#   - Hoàn thiện image version, volume, network
#   - Tạo file infrastructure/docker/postgres/init-multi-db.sh
#     để init sẵn 4 database trong 1 instance (hoặc tách 4 container)
# ============================================================
version: "3.9"

services:
  # ---------- PostgreSQL ----------
  postgres-identity:
    image: postgres:16
    container_name: sse-pg-identity
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: sse
      POSTGRES_PASSWORD: sse_dev
    ports: ["5441:5432"]
    volumes: ["./infrastructure/docker/postgres/identity:/var/lib/postgresql/data"]

  postgres-academic:
    image: postgres:16
    container_name: sse-pg-academic
    environment:
      POSTGRES_DB: academic_db
      POSTGRES_USER: sse
      POSTGRES_PASSWORD: sse_dev
    ports: ["5442:5432"]
    volumes: ["./infrastructure/docker/postgres/academic:/var/lib/postgresql/data"]

  postgres-finance:
    image: postgres:16
    container_name: sse-pg-finance
    environment:
      POSTGRES_DB: finance_db
      POSTGRES_USER: sse
      POSTGRES_PASSWORD: sse_dev
    ports: ["5443:5432"]
    volumes: ["./infrastructure/docker/postgres/finance:/var/lib/postgresql/data"]

  postgres-notification:
    image: postgres:16
    container_name: sse-pg-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: sse
      POSTGRES_PASSWORD: sse_dev
    ports: ["5444:5432"]
    volumes: ["./infrastructure/docker/postgres/notification:/var/lib/postgresql/data"]

  # ---------- MongoDB ----------
  mongo:
    image: mongo:7
    container_name: sse-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: sse
      MONGO_INITDB_ROOT_PASSWORD: sse_dev
    ports: ["27017:27017"]
    volumes: ["./infrastructure/docker/mongodb/data:/data/db"]

  # ---------- RabbitMQ ----------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: sse-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: sse
      RABBITMQ_DEFAULT_PASS: sse_dev
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI

  # ---------- MinIO ----------
  minio:
    image: minio/minio:latest
    container_name: sse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sse
      MINIO_ROOT_PASSWORD: sse_dev_minio
    ports:
      - "9000:9000"     # S3 API
      - "9001:9001"     # Console UI
    volumes: ["./infrastructure/docker/minio/data:/data"]

  minio-init:
    image: minio/mc:latest
    container_name: sse-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 sse sse_dev_minio; do sleep 1; done;
      mc mb --ignore-existing local/sse-files;
      mc cors set local/sse-files /config/cors.json;
    volumes: ["./infrastructure/docker/minio/cors.json:/config/cors.json:ro"]

  # ---------- Mailhog (giả lập SMTP cho dev) ----------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sse-mailhog
    ports:
      - "1025:1025"     # SMTP
      - "8025:8025"     # Web UI
