spring:
  flyway:
    enabled: true
  datasource:
    # Lưu trên đĩa để dữ liệu và lịch sử migration không mất khi Backend dừng.
    url: jdbc:h2:file:${SSE_LOCAL_DB_PATH:./data/sse};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate

sse:
  jwt:
    secret: local-only-secret-change-me-0123456789-abcdef
  seed:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
  password-reset:
    expose-token: true
  payments:
    mode: sandbox
    callback-secret: local-sandbox-callback-secret-change-me
  storage:
    path: ${SSE_LOCAL_STORAGE_PATH:./data/uploads}
