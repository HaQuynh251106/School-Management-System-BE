spring:
  flyway:
    enabled: true
  datasource:
    # Profile local sử dụng PostgreSQL thật. Thông tin kết nối được đọc từ .env.local
    # qua scripts/start-postgres-local.ps1, không lưu mật khẩu trong mã nguồn.
    url: ${SSE_DB_URL:jdbc:postgresql://127.0.0.1:5432/sse_db}
    username: ${SSE_DB_USER:sse}
    password: ${SSE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

sse:
  jwt:
    secret: local-only-secret-change-me-0123456789-abcdef
  seed:
    # Chỉ tạo dữ liệu khởi tạo khi database còn trống; các lần chạy sau không ghi đè dữ liệu thật.
    enabled: ${SSE_SEED_ENABLED:false}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
  password-reset:
    expose-token: true
  payments:
    mode: sandbox
    callback-secret: local-sandbox-callback-secret-change-me
  storage:
    path: ${SSE_LOCAL_STORAGE_PATH:./data/uploads}
