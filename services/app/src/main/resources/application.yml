# ============================================================
# SSE Modular Monolith — môi trường DEV LOCAL
# Chạy:  mvn -pl services/app spring-boot:run    (hoặc java -jar target/sse-app.jar)
# Phục vụ cả Web FE và Mobile FE — drop-in thay thế mock-server (cùng cổng 4000).
# ============================================================
server:
  port: 4000

spring:
  application:
    name: sse-app

  # PostgreSQL local (Homebrew). Override bằng biến môi trường khi cần.
  datasource:
    url: ${SSE_DB_URL:jdbc:postgresql://localhost:5432/sse_db}
    username: ${SSE_DB_USER:sse}
    password: ${SSE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Production schema must be managed by versioned migrations.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${SSE_MAIL_HOST:localhost}
    port: ${SSE_MAIL_PORT:587}
    username: ${SSE_MAIL_USERNAME:}
    password: ${SSE_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SSE_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SSE_MAIL_STARTTLS:true}

sse:
  environment: ${SSE_ENVIRONMENT:local}
  jwt:
    # Required outside local/test. Use a secret manager in production.
    secret: ${SSE_JWT_SECRET}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
    cookie-secure: ${SSE_COOKIE_SECURE:false}
  seed:
    enabled: ${SSE_SEED_ENABLED:false}
  cors:
    allowed-origins: ${SSE_CORS_ALLOWED_ORIGINS}
  password-reset:
    expose-token: false
  payments:
    # vietqr = tạo QR chuyển khoản thật; hóa đơn chỉ hoàn tất sau khi Admin đối soát.
    mode: ${SSE_PAYMENT_MODE:disabled}
    public-base-url: ${SSE_PAYMENT_PUBLIC_BASE_URL:http://127.0.0.1:4000}
    sandbox:
      enabled: ${SSE_PAYMENT_SANDBOX_ENABLED:false}
      merchant-code: ${SSE_PAYMENT_SANDBOX_MERCHANT:SSE_SCHOOL}
      secret: ${SSE_PAYMENT_SANDBOX_SECRET:local-sandbox-secret-change-me}
    vietqr:
      bank-id: ${SSE_VIETQR_BANK_ID:}
      account-no: ${SSE_VIETQR_ACCOUNT_NO:}
      account-name: ${SSE_VIETQR_ACCOUNT_NAME:}
      template: ${SSE_VIETQR_TEMPLATE:compact2}
  storage:
    path: ${SSE_STORAGE_PATH:/data/sse/uploads}
    max-file-bytes: ${SSE_STORAGE_MAX_FILE_BYTES:10485760}
    user-quota-bytes: ${SSE_STORAGE_USER_QUOTA_BYTES:104857600}
  mail:
    enabled: ${SSE_MAIL_ENABLED:false}
    from: ${SSE_MAIL_FROM:no-reply@smartschool.local}
    reset-url: ${SSE_PASSWORD_RESET_URL:http://localhost:5173/reset-password}
  push:
    firebase:
      enabled: ${SSE_FIREBASE_ENABLED:false}
      project-id: ${SSE_FIREBASE_PROJECT_ID:}
      credentials-path: ${SSE_FIREBASE_CREDENTIALS_PATH:}
      credentials-base64: ${SSE_FIREBASE_CREDENTIALS_BASE64:}
  attendance-reminders:
    enabled: ${SSE_ATTENDANCE_REMINDERS_ENABLED:true}
    interval-ms: ${SSE_ATTENDANCE_REMINDER_INTERVAL_MS:60000}
    initial-delay-ms: ${SSE_ATTENDANCE_REMINDER_INITIAL_DELAY_MS:15000}
  exam-reminders:
    enabled: ${SSE_EXAM_REMINDERS_ENABLED:true}
    interval-ms: ${SSE_EXAM_REMINDER_INTERVAL_MS:3600000}
    initial-delay-ms: ${SSE_EXAM_REMINDER_INITIAL_DELAY_MS:20000}

logging:
  file:
    path: ${SSE_LOG_PATH:logs}
  level:
    com.sse.app: INFO
    org.hibernate.SQL: WARN

management:
  server:
    port: ${SSE_MANAGEMENT_PORT:${server.port}}
  health:
    mail:
      enabled: ${SSE_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SSE_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

info:
  app:
    name: Smart School Ecosystem
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
