# ============================================================
# SSE Modular Monolith — môi trường DEV LOCAL
# Chạy:  mvn -pl services/app spring-boot:run    (hoặc java -jar target/sse-app.jar)
# Phục vụ cả Web FE và Mobile FE — drop-in thay thế mock-server (cùng cổng 4000).
# ============================================================
server:
  port: 4000

spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: sse-app

  # Monolith-first local database managed in pgAdmin.
  datasource:
    url: ${SSE_DB_URL:jdbc:postgresql://localhost:5432/sse_db}
    username: ${SSE_DB_USER:postgres}
    password: ${SSE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Hibernate tự tạo/cập nhật schema từ entity (DEV). Production nên chuyển sang Flyway.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
    defer-datasource-initialization: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

  rabbitmq:
    host: ${SSE_RABBITMQ_HOST:localhost}
    port: ${SSE_RABBITMQ_PORT:5672}
    username: ${SSE_RABBITMQ_USER:sse}
    password: ${SSE_RABBITMQ_PASSWORD:sse_dev}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 5000
        default-requeue-rejected: false

sse:
  jwt:
    # Đổi secret khi deploy. Tối thiểu 32 bytes cho HS256.
    secret: ${SSE_JWT_SECRET:dev-secret-do-not-use-in-prod-change-me-please-0123456789}
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  seed:
    enabled: true
    dataset: ${SSE_SEED_DATASET:baseline}
  events:
    rabbitmq:
      enabled: ${SSE_EVENTS_RABBITMQ_ENABLED:true}
    local-listener:
      enabled: ${SSE_EVENTS_LOCAL_LISTENER_ENABLED:false}
  rabbitmq:
    exchange: ${SSE_RABBITMQ_EXCHANGE:sse.events}
    dead-letter-exchange: ${SSE_RABBITMQ_DLX:sse.events.dlx}
    notification-queue: ${SSE_RABBITMQ_NOTIFICATION_QUEUE:sse.notification.events}
    notification-dead-letter-queue: ${SSE_RABBITMQ_NOTIFICATION_DLQ:sse.notification.events.dlq}
    notification-dead-letter-routing-key: ${SSE_RABBITMQ_NOTIFICATION_DLX_KEY:notification.failed}
  notifications:
    worker:
      enabled: ${SSE_NOTIFICATION_WORKER_ENABLED:true}
  payment:
    public-base-url: ${SSE_PAYMENT_PUBLIC_BASE_URL:http://127.0.0.1:4000}
    sandbox-secret: ${SSE_PAYMENT_SANDBOX_SECRET:dev-payment-secret-change-me}
    vnpay:
      enabled: ${SSE_VNPAY_ENABLED:false}
      tmn-code: ${SSE_VNPAY_TMN_CODE:}
      hash-secret: ${SSE_VNPAY_HASH_SECRET:}
      payment-url: ${SSE_VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${SSE_VNPAY_RETURN_URL:http://127.0.0.1:5173/?paymentReturn=vnpay}
      ipn-url: ${SSE_VNPAY_IPN_URL:http://127.0.0.1:4000/payments/vnpay/ipn}
      expire-minutes: ${SSE_VNPAY_EXPIRE_MINUTES:15}
    momo:
      enabled: ${SSE_MOMO_ENABLED:false}
      partner-code: ${SSE_MOMO_PARTNER_CODE:}
      access-key: ${SSE_MOMO_ACCESS_KEY:}
      secret-key: ${SSE_MOMO_SECRET_KEY:}
      create-url: ${SSE_MOMO_CREATE_URL:https://test-payment.momo.vn/v2/gateway/api/create}
      redirect-url: ${SSE_MOMO_REDIRECT_URL:http://127.0.0.1:5173/?paymentReturn=momo}
      ipn-url: ${SSE_MOMO_IPN_URL:http://127.0.0.1:4000/payments/momo/ipn}
      partner-name: ${SSE_MOMO_PARTNER_NAME:SSE School}
      store-id: ${SSE_MOMO_STORE_ID:SSESchool}
    bank-transfer:
      enabled: ${SSE_MB_BANK_TRANSFER_ENABLED:false}
      bank-id: ${SSE_MB_BANK_ID:MB}
      bank-name: ${SSE_MB_BANK_NAME:MB Bank}
      account-number: ${SSE_MB_ACCOUNT_NUMBER:}
      account-name: ${SSE_MB_ACCOUNT_NAME:}
      transfer-prefix: ${SSE_MB_TRANSFER_PREFIX:SSE}
      qr-base-url: ${SSE_VIETQR_BASE_URL:https://img.vietqr.io/image}
  storage:
    minio:
      endpoint: ${SSE_MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${SSE_MINIO_ACCESS_KEY:sse}
      secret-key: ${SSE_MINIO_SECRET_KEY:sse_dev_minio}
      bucket: ${SSE_MINIO_BUCKET:sse-files}
      presign-expiry-seconds: ${SSE_MINIO_PRESIGN_EXPIRY_SECONDS:900}

logging:
  level:
    com.sse.app: INFO
    org.hibernate.SQL: WARN
