services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sse_db
      POSTGRES_USER: sse
      POSTGRES_PASSWORD: ${SSE_DB_PASSWORD:?Set SSE_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sse -d sse_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SSE_DB_URL: jdbc:postgresql://postgres:5432/sse_db
      SSE_DB_USER: sse
      SSE_DB_PASSWORD: ${SSE_DB_PASSWORD:?Set SSE_DB_PASSWORD in .env}
      SSE_JWT_SECRET: ${SSE_JWT_SECRET:?Set a 32+ character SSE_JWT_SECRET in .env}
      SSE_CORS_ALLOWED_ORIGINS: ${SSE_CORS_ALLOWED_ORIGINS:?Set the Web application origin in .env}
      SSE_SEED_ENABLED: ${SSE_SEED_ENABLED:-false}
      SSE_PAYMENT_MODE: ${SSE_PAYMENT_MODE:-disabled}
      SSE_VIETQR_BANK_ID: ${SSE_VIETQR_BANK_ID:-}
      SSE_VIETQR_ACCOUNT_NO: ${SSE_VIETQR_ACCOUNT_NO:-}
      SSE_VIETQR_ACCOUNT_NAME: ${SSE_VIETQR_ACCOUNT_NAME:-}
      SSE_VIETQR_TEMPLATE: ${SSE_VIETQR_TEMPLATE:-compact2}
      SSE_STORAGE_PATH: /data/uploads
      SSE_MAIL_ENABLED: ${SSE_MAIL_ENABLED:-false}
      SSE_MAIL_HOST: ${SSE_MAIL_HOST:-localhost}
      SSE_MAIL_PORT: ${SSE_MAIL_PORT:-587}
      SSE_MAIL_USERNAME: ${SSE_MAIL_USERNAME:-}
      SSE_MAIL_PASSWORD: ${SSE_MAIL_PASSWORD:-}
      SSE_MAIL_FROM: ${SSE_MAIL_FROM:-no-reply@smartschool.local}
      SSE_PASSWORD_RESET_URL: ${SSE_PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      SSE_FIREBASE_ENABLED: ${SSE_FIREBASE_ENABLED:-false}
      SSE_FIREBASE_PROJECT_ID: ${SSE_FIREBASE_PROJECT_ID:-}
      SSE_FIREBASE_CREDENTIALS_BASE64: ${SSE_FIREBASE_CREDENTIALS_BASE64:-}
    ports:
      - "${SSE_BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - uploads-data:/data/uploads

volumes:
  postgres-data:
    name: ${SSE_POSTGRES_VOLUME:-school-management-system-be_postgres-data}
  uploads-data:
