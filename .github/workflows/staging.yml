name: Full-stack Staging Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [trungbui12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: School-Management-System-BE

      - uses: actions/checkout@v4
        with:
          repository: HaQuynh251106/School-Management-System-Web-FE
          ref: ${{ github.head_ref || github.ref_name }}
          path: School-Management-System-Web-FE

      - name: Create ephemeral staging environment
        shell: bash
        run: |
          cat > School-Management-System-BE/.env.staging.local <<EOF
          SSE_BACKEND_IMAGE=school-management-backend:staging
          SSE_WEB_IMAGE=school-management-web:staging
          SSE_WEB_PORT=5180
          SSE_BACKEND_PORT=4100
          SSE_DB_NAME=sse_staging
          SSE_DB_USER=sse_staging
          SSE_DB_PASSWORD=$(openssl rand -hex 24)
          SSE_JWT_SECRET=$(openssl rand -hex 48)
          SSE_CORS_ALLOWED_ORIGINS=http://127.0.0.1:5180
          SSE_PASSWORD_RESET_URL=http://127.0.0.1:5180/reset-password
          SSE_PAYMENT_MODE=vietqr
          SSE_VIETQR_BANK_ID=970407
          SSE_VIETQR_ACCOUNT_NO=19070943135011
          SSE_VIETQR_ACCOUNT_NAME=BUI DUC TRUNG
          SSE_VIETQR_TEMPLATE=compact2
          SSE_STAGING_PUBLIC_API=http://127.0.0.1:4100
          SSE_MAIL_ENABLED=false
          EOF

      - name: Build and start isolated staging stack
        working-directory: School-Management-System-BE
        run: docker compose -p school-staging --env-file .env.staging.local -f docker-compose.prod.yml -f docker-compose.staging.yml up -d --build --wait --wait-timeout 240

      - name: Smoke test staging
        run: |
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:4101/actuator/health
          curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:5180/

      - name: Collect service logs on failure
        if: failure()
        working-directory: School-Management-System-BE
        run: docker compose -p school-staging --env-file .env.staging.local -f docker-compose.prod.yml -f docker-compose.staging.yml logs --no-color

      - name: Stop staging stack
        if: always()
        working-directory: School-Management-System-BE
        run: docker compose -p school-staging --env-file .env.staging.local -f docker-compose.prod.yml -f docker-compose.staging.yml down -v
