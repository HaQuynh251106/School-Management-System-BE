name: CI

# TODO (P1 - S1): hoàn thiện workflow.
# Mục tiêu: trigger trên PR vào develop/main → build + test + spotless check.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        run: mvn -T 1C -B -DskipTests clean install

      - name: Test
        run: mvn -B test

      # - name: Spotless check
      #   run: mvn spotless:check
