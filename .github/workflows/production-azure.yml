name: Deploy Backend to Azure Production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Test Backend
        run: mvn -T 1C -B -pl services/app -am clean test

      - name: Sign in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        shell: bash
        env:
          ACR: ${{ vars.AZURE_CONTAINER_REGISTRY }}
          IMAGE_NAME: ${{ vars.AZURE_BACKEND_IMAGE }}
        run: |
          set -Eeuo pipefail
          az acr login --name "$ACR"
          image="$ACR.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"
          docker buildx build \
            --platform linux/amd64 \
            --push \
            --tag "$image" \
            .
          echo "value=$image" >> "$GITHUB_OUTPUT"

      - name: Update Container App
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          IMAGE: ${{ steps.image.outputs.value }}
        run: |
          set -Eeuo pipefail
          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CONTAINER_APP" \
            --image "$IMAGE" \
            --output none

      - name: Verify production health
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          set -Eeuo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "$API_URL/actuator/health" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Backend health check did not become UP"
          exit 1
