openapi: 3.1.0
info:
  title: School Management Club API
  version: 1.0.0
  description: Contract for F13 club creation, registration, approval, waitlist, invoice and cancellation.
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /clubs:
    get:
      operationId: listClubs
      x-roles: [ADMIN, STUDENT, PARENT]
      x-object-permission: Authenticated users see club availability and registration windows, never another student's registration.
      x-idempotency: Safe read operation.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      responses:
        '200': { description: Clubs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Club' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createClub
      x-roles: [ADMIN]
      x-object-permission: School-wide administrative mutation.
      x-idempotency: Club code and optional client supplied id are unique; duplicate creation returns 409.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateClubRequest' } } }
      responses:
        '200': { description: Created club, content: { application/json: { schema: { $ref: '#/components/schemas/Club' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clubs/{clubId}/registrations:
    post:
      operationId: registerClub
      x-roles: [STUDENT, PARENT]
      x-object-permission: Student registers self; parent must be linked to studentId. Active duplicate registrations are rejected.
      x-idempotency: One active registration per club and student; duplicate request returns 409.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters: [{ $ref: '#/components/parameters/ClubId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterClubRequest' } } }
      responses:
        '200': { description: PENDING, WAITLIST or APPROVED registration, content: { application/json: { schema: { $ref: '#/components/schemas/ClubRegistration' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/club-registrations:
    get:
      operationId: listMyClubRegistrations
      x-roles: [STUDENT]
      x-object-permission: Student sees only own registrations.
      x-idempotency: Safe read operation.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      responses:
        '200': { description: Own registrations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClubRegistration' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /children/{studentId}/club-registrations:
    get:
      operationId: listChildClubRegistrations
      x-roles: [PARENT]
      x-object-permission: Parent must be linked to studentId.
      x-idempotency: Safe read operation.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses:
        '200': { description: Child registrations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClubRegistration' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/club-registrations:
    get:
      operationId: listAdminClubRegistrations
      x-roles: [ADMIN]
      x-object-permission: School-wide administrative read; optional club and status filters apply.
      x-idempotency: Safe read operation.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters:
        - { name: clubId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RegistrationStatus' } }
      responses:
        '200': { description: Filtered registrations, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ClubRegistration' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /club-registrations/{registrationId}/approve:
    post:
      operationId: approveClubRegistration
      x-roles: [ADMIN]
      x-object-permission: Registration must be PENDING or WAITLIST and capacity must be available.
      x-idempotency: Repeating after APPROVED returns 409; invoice is created at most once after approval.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } }
      responses:
        '200': { description: Approved registration with optional invoiceId, content: { application/json: { schema: { $ref: '#/components/schemas/ClubRegistration' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /club-registrations/{registrationId}/reject:
    post:
      operationId: rejectClubRegistration
      x-roles: [ADMIN]
      x-object-permission: Registration must be PENDING or WAITLIST.
      x-idempotency: Repeating after REJECTED returns 409.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/DecisionRequest' } } }
      responses:
        '200': { description: Rejected registration, content: { application/json: { schema: { $ref: '#/components/schemas/ClubRegistration' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /club-registrations/{registrationId}/cancel:
    post:
      operationId: cancelClubRegistration
      x-roles: [ADMIN, STUDENT, PARENT]
      x-object-permission: Student owns registration; parent is linked to student; admin is school-wide.
      x-idempotency: Only active registrations can transition to CANCELLED; invoice cancel/refund and waitlist promotion happen once.
      x-owners: { backend: Club, frontend: Mobile, test: Club }
      parameters: [{ $ref: '#/components/parameters/RegistrationId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/CancelRequest' } } }
      responses:
        '200': { description: Cancelled registration, content: { application/json: { schema: { $ref: '#/components/schemas/ClubRegistration' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ClubId: { name: clubId, in: path, required: true, schema: { type: string, minLength: 1 } }
    RegistrationId: { name: registrationId, in: path, required: true, schema: { type: string, minLength: 1 } }
    StudentId: { name: studentId, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    BadRequest: { description: Invalid fields or registration dates, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: Role or child ownership denied, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Club, registration or student not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: Duplicate, closed window, capacity or invalid state transition, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    RegistrationStatus: { type: string, enum: [PENDING, WAITLIST, APPROVED, REJECTED, CANCELLED] }
    CreateClubRequest:
      type: object
      required: [code, name, schedule, capacity, feeAmount, approvalRequired, registrationStart, registrationEnd]
      properties:
        id: { type: [string, 'null'] }
        code: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        schedule: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        feeAmount: { type: integer, minimum: 0 }
        approvalRequired: { type: boolean }
        registrationStart: { type: string, format: date }
        registrationEnd: { type: string, format: date }
        active: { type: [boolean, 'null'], default: true }
    RegisterClubRequest:
      type: object
      properties:
        studentId: { type: [string, 'null'] }
    DecisionRequest:
      type: object
      properties:
        note: { type: [string, 'null'] }
    CancelRequest:
      type: object
      properties:
        reason: { type: [string, 'null'] }
    Club:
      type: object
      required: [id, code, name, schedule, capacity, approvedCount, availableSlots, waitlistCount, feeAmount, approvalRequired, registrationStart, registrationEnd, active]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        schedule: { type: string }
        capacity: { type: integer, minimum: 1 }
        approvedCount: { type: integer, minimum: 0 }
        availableSlots: { type: integer, minimum: 0 }
        waitlistCount: { type: integer, minimum: 0 }
        feeAmount: { type: integer, minimum: 0 }
        approvalRequired: { type: boolean }
        registrationStart: { type: string, format: date }
        registrationEnd: { type: string, format: date }
        active: { type: boolean }
    ClubRegistration:
      type: object
      required: [id, clubId, clubName, studentId, studentName, requestedBy, status, waitlistPosition, createdAt]
      properties:
        id: { type: string }
        clubId: { type: string }
        clubName: { type: string }
        studentId: { type: string }
        studentName: { type: string }
        requestedBy: { type: string }
        status: { $ref: '#/components/schemas/RegistrationStatus' }
        invoiceId: { type: [string, 'null'] }
        decisionNote: { type: [string, 'null'] }
        waitlistPosition: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
    ApiError:
      type: object
      required: [status, error]
      properties:
        timestamp: { type: [string, 'null'], format: date-time }
        status: { type: integer }
        code: { type: [string, 'null'] }
        error: { type: string }
        path: { type: [string, 'null'] }
        requestId: { type: [string, 'null'] }
