openapi: 3.1.0
info:
  title: School Management Assignment API
  version: 1.0.0
  description: Contract for F11 assignment, private files, submission, grading and resubmission.
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /me/assignments:
    get:
      operationId: listMyAssignments
      x-roles: [TEACHER, STUDENT]
      x-object-permission: Teacher sees owned assignments; student sees non-draft assignments of the current class.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      responses:
        '200': { description: Scoped assignments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/submissions:
    get:
      operationId: listMySubmissions
      x-roles: [STUDENT]
      x-object-permission: Student sees only submissions whose studentId is the authenticated user.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      responses:
        '200': { description: Student submissions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Submission' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /children/{studentId}/assignments:
    get:
      operationId: listChildAssignments
      x-roles: [PARENT]
      x-object-permission: Parent must be linked to studentId; draft assignments are never returned.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses:
        '200': { description: Child assignments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /children/{studentId}/submissions:
    get:
      operationId: listChildSubmissions
      x-roles: [PARENT]
      x-object-permission: Parent must be linked to studentId.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/StudentId' }]
      responses:
        '200': { description: Child submissions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Submission' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assignments:
    get:
      operationId: listAssignments
      x-roles: [ADMIN, TEACHER, STUDENT]
      x-object-permission: Admin may filter school-wide; teacher is always constrained to own assignments; student is constrained to current class and non-draft assignments.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters:
        - { name: classId, in: query, schema: { type: string } }
        - { name: teacherId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssignmentStatus' } }
      responses:
        '200': { description: Scoped assignments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Assignment' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createAssignment
      x-roles: [ADMIN, TEACHER]
      x-object-permission: Teacher must have an active teaching assignment for classId and subjectId; attached file must be owned by the actor.
      x-idempotency: Client supplied id is unique; retry with the same id may conflict after creation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateAssignmentRequest' } } }
      responses:
        '200': { description: Draft or published assignment, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /assignments/{assignmentId}/publish:
    post:
      operationId: publishAssignment
      x-roles: [ADMIN, TEACHER]
      x-object-permission: Teacher must own the assignment; publishing notifies the class.
      x-idempotency: Re-publishing an already published assignment returns the same assignment without duplicate state transition.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      responses:
        '200': { description: Published assignment, content: { application/json: { schema: { $ref: '#/components/schemas/Assignment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assignments/{assignmentId}/submissions:
    get:
      operationId: listAssignmentSubmissions
      x-roles: [ADMIN, TEACHER]
      x-object-permission: Teacher must own the assignment.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      responses:
        '200': { description: Assignment submissions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Submission' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /assignments/{assignmentId}/submit:
    post:
      operationId: submitAssignment
      x-roles: [STUDENT]
      x-object-permission: Student must belong to the assignment class; attachmentFileId must be owned by the student.
      x-idempotency: One current submission per assignment and student; resubmission updates it only after explicit permission and records an attempt.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitRequest' } } }
      responses:
        '200': { description: Current submission, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SUBMISSION_CLOSED, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /submissions/{submissionId}/grade:
    post:
      operationId: gradeSubmission
      x-roles: [ADMIN, TEACHER]
      x-object-permission: Teacher must own the parent assignment.
      x-idempotency: Regrading updates the same submission and attempt snapshot; it does not create a second submission.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GradeSubmissionRequest' } } }
      responses:
        '200': { description: Graded submission, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /submissions/{submissionId}/allow-resubmit:
    post:
      operationId: allowAssignmentResubmission
      x-roles: [ADMIN, TEACHER]
      x-object-permission: Teacher must own the parent assignment; assignment must be published and submission graded.
      x-idempotency: Repeating after state changed is rejected as an invalid transition.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      responses:
        '200': { description: Resubmission enabled, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /submissions/{submissionId}/attempts:
    get:
      operationId: listSubmissionAttempts
      x-roles: [ADMIN, TEACHER, STUDENT, PARENT]
      x-object-permission: Teacher owns assignment; student owns submission; parent is linked to student.
      x-idempotency: Safe read operation.
      x-owners: { backend: Academic, frontend: Mobile, test: Academic }
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      responses:
        '200': { description: Immutable attempt history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SubmissionAttempt' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, minLength: 1 } }
    SubmissionId: { name: submissionId, in: path, required: true, schema: { type: string, minLength: 1 } }
    StudentId: { name: studentId, in: path, required: true, schema: { type: string, minLength: 1 } }
  responses:
    BadRequest: { description: Invalid request or transition, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Forbidden: { description: Role or object permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Assignment, submission, student or file not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: Business state conflict, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    AssignmentStatus: { type: string, enum: [DRAFT, PUBLISHED, CLOSED] }
    SubmissionStatus: { type: string, enum: [SUBMITTED, LATE, GRADED, RESUBMISSION_ALLOWED] }
    CreateAssignmentRequest:
      type: object
      required: [classId, subjectId, title]
      properties:
        id: { type: [string, 'null'] }
        classId: { type: string, minLength: 1 }
        subjectId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        deadline: { type: [string, 'null'], format: date-time }
        allowLate: { type: [boolean, 'null'], default: false }
        attachmentFileId: { type: [string, 'null'] }
        publishNow: { type: [boolean, 'null'], default: false }
    SubmitRequest:
      type: object
      properties:
        content: { type: [string, 'null'] }
        attachmentFileId: { type: [string, 'null'] }
    GradeSubmissionRequest:
      type: object
      required: [score]
      properties:
        score: { type: number, minimum: 0, maximum: 10 }
        feedback: { type: [string, 'null'] }
    Assignment:
      type: object
      required: [id, classId, subjectId, teacherId, title, status, allowLate]
      properties:
        id: { type: string }
        classId: { type: string }
        subjectId: { type: string }
        subjectName: { type: [string, 'null'] }
        teacherId: { type: string }
        teacherName: { type: [string, 'null'] }
        title: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/AssignmentStatus' }
        deadline: { type: [string, 'null'], format: date-time }
        allowLate: { type: boolean }
        attachmentFileId: { type: [string, 'null'] }
        attachmentName: { type: [string, 'null'] }
        submissionCount: { type: integer, minimum: 0 }
        studentCount: { type: integer, minimum: 0 }
    Submission:
      type: object
      required: [id, assignmentId, studentId, status, attemptNumber, resubmissionAllowed]
      properties:
        id: { type: string }
        assignmentId: { type: string }
        studentId: { type: string }
        studentName: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SubmissionStatus' }
        attemptNumber: { type: integer, minimum: 1 }
        resubmissionAllowed: { type: boolean }
        content: { type: [string, 'null'] }
        attachmentFileId: { type: [string, 'null'] }
        attachmentName: { type: [string, 'null'] }
        submittedAt: { type: [string, 'null'], format: date-time }
        score: { type: [number, 'null'], minimum: 0, maximum: 10 }
        feedback: { type: [string, 'null'] }
        gradedBy: { type: [string, 'null'] }
        gradedAt: { type: [string, 'null'], format: date-time }
    SubmissionAttempt:
      allOf:
        - { $ref: '#/components/schemas/Submission' }
        - type: object
          properties:
            submissionId: { type: string }
    ApiError:
      type: object
      required: [status, code, error, path, requestId]
      properties:
        status: { type: integer }
        code: { type: string }
        error: { type: string }
        path: { type: string }
        requestId: { type: string }
