openapi: 3.1.0
info: { title: SSE Academic API, version: 0.1.0 }
servers: [{ url: / }]
tags: [{ name: Academic }]
paths:
  /academicYears:
    get:
      tags: [Academic]
      operationId: listAcademicYears
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap doc co cau nam hoc.
      x-idempotency: Read-only.
      x-owners: &owners { backend: Academic, client: Mobile }
      responses: { '200': { description: Danh sach nam hoc, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AcademicYear' } } } } } }
  /semesters:
    get:
      tags: [Academic]
      operationId: listSemesters
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap doc hoc ky.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters: [{ name: academicYearId, in: query, schema: { type: string } }]
      responses: { '200': { description: Danh sach hoc ky, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Semester' } } } } } }
  /classes:
    get:
      tags: [Academic]
      operationId: listClasses
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Doc danh sach lop; du lieu hoc sinh chi qua endpoint co pham vi rieng.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: academicYearId, in: query, schema: { type: string } }
        - { name: gradeLevel, in: query, schema: { type: string } }
      responses: { '200': { description: Danh sach lop, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SchoolClass' } } } } } }
    post:
      tags: [Academic]
      operationId: createClass
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu tao lop.
      x-idempotency: Ma lop la duy nhat trong pham vi nghiep vu.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateClassRequest' } } } }
      responses:
        '200': { description: Lop vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/SchoolClass' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
  /subjects:
    get:
      tags: [Academic]
      operationId: listSubjects
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap doc danh muc mon.
      x-idempotency: Read-only.
      x-owners: *owners
      responses: { '200': { description: Danh sach mon, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subject' } } } } } }
    post:
      tags: [Academic]
      operationId: createSubject
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu tao mon.
      x-idempotency: Ma mon la duy nhat.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSubjectRequest' } } } }
      responses:
        '200': { description: Mon vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/Subject' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
  /rooms:
    get:
      tags: [Academic]
      operationId: listRooms
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap doc danh muc phong.
      x-idempotency: Read-only.
      x-owners: *owners
      responses: { '200': { description: Danh sach phong, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Room' } } } } } }
    post:
      tags: [Academic]
      operationId: createRoom
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu tao phong.
      x-idempotency: Ma phong la duy nhat.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoomRequest' } } } }
      responses:
        '200': { description: Phong vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/Room' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
  /timetableSlots:
    get:
      tags: [Academic]
      operationId: listTimetableSlots
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Admin/Giao vu xem toan bo; GV xem lop duoc phan cong; HS xem lop minh; PH xem lop con.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: classId, in: query, schema: { type: string } }
        - { name: teacherId, in: query, schema: { type: string } }
        - { name: semesterId, in: query, schema: { type: string } }
        - { name: dayOfWeek, in: query, schema: { type: string } }
      responses:
        '200': { description: Cac tiet hoc trong pham vi, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimetableSlot' } } } } }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
    post:
      tags: [Academic]
      operationId: createTimetableSlot
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu xep tiet theo phan cong giang day.
      x-idempotency: Trung lop, giao vien hoac phong tai cung thoi diem bi tu choi.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveTimetableSlotRequest' } } } }
      responses:
        '200': { description: Tiet hoc vua xep, content: { application/json: { schema: { $ref: '#/components/schemas/TimetableSlot' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /teaching-assignments:
    get:
      tags: [Academic]
      operationId: listTeachingAssignments
      x-roles: [ADMIN, ACADEMIC_STAFF, TEACHER]
      x-object-permission: Giao vien chi xem phan cong cua minh; Admin/Giao vu xem toan bo.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: classId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: teacherId, in: query, schema: { type: string } }
        - { name: semesterId, in: query, schema: { type: string } }
        - { name: dayOfWeek, in: query, schema: { type: string } }
        - { name: periodNo, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      responses: { '200': { description: Danh sach phan cong, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TeachingAssignment' } } } } } }
    post:
      tags: [Academic]
      operationId: createTeachingAssignment
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu phan cong giang day.
      x-idempotency: Mot bo lop-mon-hoc ky chi co mot phan cong hop le.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveTeachingAssignmentRequest' } } } }
      responses:
        '200': { description: Phan cong vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/TeachingAssignment' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /me/timetable:
    get:
      tags: [Academic]
      operationId: getMyTimetable
      x-roles: [TEACHER, STUDENT]
      x-object-permission: TKB suy ra tu giao vien hoac lop cua token hien tai.
      x-idempotency: Read-only.
      x-owners: *owners
      responses: { '200': { description: TKB ca nhan, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TimetableSlot' } } } } } }
  /attendance:
    get:
      tags: [Academic]
      operationId: listAttendance
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Student chi xem minh; Parent chi xem con lien ket; Teacher phai chon slot duoc phan cong; Admin va Giao vu xem theo bo loc.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: studentId, in: query, schema: { type: string } }
        - { name: classId, in: query, schema: { type: string } }
        - { name: slotId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Lich su diem danh trong pham vi, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceRecord' } } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /attendance/bulk:
    post:
      tags: [Academic]
      operationId: bulkMarkAttendance
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi diem danh tiet duoc phan cong; Admin co quyen xu ly toan truong.
      x-idempotency: Upsert duy nhat theo slotId, date va studentId; gui lai cap nhat cung ban ghi.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkAttendanceRequest' } } } }
      responses:
        '200': { description: Cac ban ghi sau khi luu, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AttendanceRecord' } } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /attendance/day-status:
    get:
      tags: [Academic]
      operationId: getAttendanceDayStatus
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap kiem tra ngay hoc hay ngay nghi.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters: [{ name: date, in: query, required: true, schema: { type: string, format: date } }]
      responses: { '200': { description: Trang thai ngay hoc, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceDayStatus' } } } } }
  /attendance/session-status:
    get:
      tags: [Academic]
      operationId: getAttendanceSessionStatus
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi xem trang thai tiet duoc phan cong; Admin xem toan bo.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: slotId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Trang thai quyen diem danh cua tiet, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceSessionStatus' } } } }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /attendance/approved-leaves:
    get:
      tags: [Academic]
      operationId: listApprovedLeavesForAttendance
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Chi tra don nghi da duyet cua hoc sinh thuoc lop trong tiet hop le.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: slotId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Don nghi da duyet, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ApprovedLeave' } } } } }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /attendance/unlock:
    post:
      tags: [Academic]
      operationId: unlockLateAttendance
      x-roles: [TEACHER]
      x-object-permission: Teacher chi mo khoa tiet duoc phan cong va bat buoc ghi ly do audit.
      x-idempotency: Gui lai cho cung slot va ngay cap nhat phien mo khoa hien tai.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnlockAttendanceRequest' } } } }
      responses:
        '200': { description: Trang thai phien sau khi mo khoa, content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceSessionStatus' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /grades:
    get:
      tags: [Academic]
      operationId: listGrades
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Student chi xem minh; Parent chi xem con lien ket; Teacher phai chon lop-hoc ky va chi xem mon trong gradebook context.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: studentId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: semesterId, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: classId, in: query, schema: { type: string } }
      responses:
        '200': { description: Danh sach diem trong pham vi, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Grade' } } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
    post:
      tags: [Academic]
      operationId: createGrade
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi nhap mon duoc phan cong; Admin nhap theo mon chi dinh.
      x-idempotency: Mot student-subject-semester-category-assessmentIndex la duy nhat; trung tra 409.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGradeRequest' } } } }
      responses:
        '200': { description: Diem vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/Grade' } } } }
        '201': { description: Diem vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/Grade' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /grades/bulk:
    post:
      tags: [Academic]
      operationId: bulkUpsertGrades
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi luu diem mon duoc phan cong cho hoc sinh thuoc lop; Admin co quyen toan truong.
      x-idempotency: Upsert theo dau diem; expectedVersion chan ghi de khi cap nhat dong thoi.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BulkGradeRequest' } } } }
      responses:
        '200': { description: Cac diem sau khi luu, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Grade' } } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /me/gradebook-context:
    get:
      tags: [Academic]
      operationId: getTeacherGradebookContext
      x-roles: [TEACHER]
      x-object-permission: Chi tra mon co the xem va sua cua giao vien trong lop-hoc ky da chon.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: classId, in: query, required: true, schema: { type: string } }
        - { name: semesterId, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Context so diem, content: { application/json: { schema: { $ref: '#/components/schemas/TeacherGradebookContext' } } } }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /grades/{id}:
    put:
      tags: [Academic]
      operationId: updateGrade
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi sua diem mon duoc phan cong; Admin sua toan truong; moi thay doi co audit.
      x-idempotency: expectedVersion chan lost update; payload khong doi tra ban ghi hien tai.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateGradeRequest' } } } }
      responses:
        '200': { description: Diem sau khi sua, content: { application/json: { schema: { $ref: '#/components/schemas/Grade' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /grades/{id}/change-logs:
    get:
      tags: [Academic]
      operationId: listGradeChangeLogs
      x-roles: [TEACHER, ADMIN]
      x-object-permission: Teacher chi xem audit diem trong gradebook context; Admin xem toan bo.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Lich su thay doi diem, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/GradeChangeLog' } } } } }
        '403': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-categories:
    get:
      tags: [Academic]
      operationId: listExamCategories
      x-roles: [ADMIN, ACADEMIC_STAFF, ACCOUNTANT, TEACHER, STUDENT, PARENT]
      x-object-permission: Nguoi dung da dang nhap doc cau hinh dau diem.
      x-idempotency: Read-only.
      x-owners: *owners
      responses: { '200': { description: Danh muc dau diem, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamCategory' } } } } } }
    post:
      tags: [Academic]
      operationId: createExamCategory
      x-roles: [ADMIN]
      x-object-permission: Chi Admin tao dau diem.
      x-idempotency: Ma dau diem la duy nhat.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveExamCategoryRequest' } } } }
      responses:
        '200': { description: Dau diem vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/ExamCategory' } } } }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-categories/{id}:
    put:
      tags: [Academic]
      operationId: updateExamCategory
      x-roles: [ADMIN]
      x-object-permission: Chi Admin sua; ma da co du lieu khong duoc doi.
      x-idempotency: Cap nhat cung payload cho cung ket qua.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveExamCategoryRequest' } } } }
      responses:
        '200': { description: Dau diem sau khi sua, content: { application/json: { schema: { $ref: '#/components/schemas/ExamCategory' } } } }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
    delete:
      tags: [Academic]
      operationId: deleteExamCategory
      x-roles: [ADMIN]
      x-object-permission: Chi Admin xoa dau diem chua duoc su dung.
      x-idempotency: Xoa dau diem ton tai; da co du lieu tra 409.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Da xoa }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-periods:
    get:
      tags: [Academic]
      operationId: listExamPeriods
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi Admin va Giao vu xem tong quan cac dot thi.
      x-idempotency: Read-only.
      x-owners: *owners
      parameters:
        - { name: academicYearId, in: query, schema: { type: string } }
        - { name: semesterId, in: query, schema: { type: string } }
      responses: { '200': { description: Cac dot thi va thong ke, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamPeriodSummary' } } } } } }
    post:
      tags: [Academic]
      operationId: createExamPeriod
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Admin hoac Giao vu tao dot thi trong nam hoc va hoc ky hop le.
      x-idempotency: Ma dot thi la duy nhat; tao trung tra 409.
      x-owners: *owners
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveExamPeriodRequest' } } } }
      responses:
        '200': { description: Dot thi vua tao, content: { application/json: { schema: { $ref: '#/components/schemas/ExamPeriod' } } } }
        '400': { $ref: '#/components/responses/ApiErrorResponse' }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-periods/{id}:
    put:
      tags: [Academic]
      operationId: updateExamPeriod
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Admin hoac Giao vu sua dot thi chua bi khoa boi quy trinh.
      x-idempotency: Gui lai cung payload cho cung ket qua.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SaveExamPeriodRequest' } } } }
      responses:
        '200': { description: Dot thi sau cap nhat, content: { application/json: { schema: { $ref: '#/components/schemas/ExamPeriod' } } } }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
    delete:
      tags: [Academic]
      operationId: deleteExamPeriod
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Chi xoa dot thi chua co lich thi.
      x-idempotency: Xoa dot thi ton tai; dot thi co du lieu tra 409.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Da xoa dot thi }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-periods/{id}/publish-schedule:
    post:
      tags: [Academic]
      operationId: publishExamSchedule
      x-roles: [ADMIN, ACADEMIC_STAFF]
      x-object-permission: Phat hanh lich khi tat ca lich co phong, thi sinh va giam thi hop le.
      x-idempotency: Phat hanh lai khong tao lich trung; revision chi tang theo thay doi hop le.
      x-owners: *owners
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Dot thi da phat hanh lich, content: { application/json: { schema: { $ref: '#/components/schemas/ExamPeriod' } } } }
        '409': { $ref: '#/components/responses/ApiErrorResponse' }
  /exam-periods/{id}/schedules:
    get:
      tags: [Academic]
