components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  responses:
    ApiErrorResponse: { description: Loi phan quyen, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  schemas:
    AcademicYear:
      type: object
      required: [id, code, name, startDate, endDate, status]
      properties: { id: { type: string }, code: { type: string }, name: { type: string }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, status: { type: string } }
    Semester:
      type: object
      required: [id, academicYearId, code, name, sequence, startDate, endDate, status]
      properties: { id: { type: string }, academicYearId: { type: string }, code: { type: string }, name: { type: string }, sequence: { type: integer }, startDate: { type: string, format: date }, endDate: { type: string, format: date }, status: { type: string } }
    SchoolClass:
      type: object
      required: [id, code, name, gradeLevel, studyShift, capacity, studentCount]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        gradeLevel: { type: string }
        studyShift: { type: string }
        academicYearId: { type: [string, 'null'] }
        cohortId: { type: [string, 'null'] }
        homeroomTeacherId: { type: [string, 'null'] }
        homeroomTeacherName: { type: [string, 'null'] }
        homeroomAssignedAt: { type: [string, 'null'], format: date-time }
        homeroomAssignedBy: { type: [string, 'null'] }
        roomId: { type: [string, 'null'] }
        roomCode: { type: [string, 'null'] }
        capacity: { type: integer }
        studentCount: { type: integer }
    Subject:
